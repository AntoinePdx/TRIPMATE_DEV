name: Keep Supabase Active

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "::error::Configure the SUPABASE_URL and SUPABASE_KEY repository secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            --get "${SUPABASE_URL%/}/rest/v1/trips" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: $SUPABASE_KEY" \
            --header "Authorization: Bearer $SUPABASE_KEY" \
            --output /dev/null

      - name: Record successful ping
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > last_ping.txt
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add last_ping.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update supabase ping timestamp [skip ci]"
            git push
          fi
